[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-SEED"
version = "0.5.2"
description = "A Python API client for the SEED Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Nicholas Long" },
    { name = "Katherine Fleming" },
    { name = "Fable Turas" },
    { name = "Paul Munday" },
]
maintainers = [
    { name = "National Laboratory of the Rockies (NLR)", email = "nicholas.long@nlr.gov" },
]
keywords = ["seed", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "openpyxl==3.1.5",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/SEED-platform/py-seed"
SourceCode = "https://github.com/SEED-platform/py-seed"
Changelog = "https://github.com/SEED-platform/py-seed/blob/develop/CHANGELOG.md"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "mock==5.2.0",
    "mypy==2.3.0",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-order==1.5.0",
    "pytest-xdist==3.8.0",
    "testfixtures>=8.3.0",
    "types-requests>=2.32.0.20250602",
    "tox-uv-bare==1.35.2",
    "twine>=6.2.0",
]

[tool.setuptools.packages.find]
include = ["pyseed*"]

[tool.uv]
default-groups = ["dev"]
